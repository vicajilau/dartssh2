name: dartssh2
version: 4.0.1
description: SSH and SFTP client written in pure Dart, aiming to be feature-rich as well as easy to use.
homepage: https://github.com/vicajilau/dartssh2
repository: https://github.com/vicajilau/dartssh2
issue_tracker: https://github.com/vicajilau/dartssh2/issues
topics:
  - ssh
  - sftp
  - ssh-client
  - network
  - security

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  asn1lib: ^1.5.8
  convert: ^3.1.2
  meta: ^1.16.0
  pointycastle: ^4.0.0
  pinenacl: ^0.6.0

dev_dependencies:
  build_runner: ^2.4.12
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.15
  web: ^1.1.1

false_secrets:
  - test
